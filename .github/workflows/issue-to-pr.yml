name: Approved Issue to Pull Request

# Maintainer approves a community "new test" Issue -> this workflow converts
# the Issue Form into a complete, validated data change and opens a Pull
# Request. NOTHING is published here: the site is published by deploy.yml only
# after a human merges that PR into main.
#
# Two approval gestures are supported (both restricted to the maintainer):
#   1. add the `approved` label to an open Issue carrying `new-test`
#   2. comment `/approve` on that Issue (no label setup required)
#
# Re-running: remove and re-add the label, or comment /approve again. The
# generator is idempotent (an already-imported Issue is skipped).
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialise all imports so two Issues can never allocate the same test id.
concurrency:
  group: issue-to-pr
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.actor == 'Theweil' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'new-test') &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'approved') ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Prepare import branch
        run: |
          echo "BRANCH=auto/issue-${{ github.event.issue.number }}" >> "$GITHUB_ENV"
          git checkout -B "auto/issue-${{ github.event.issue.number }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate data change from Issue
        id: generate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: node scripts/issue-to-data.mjs

      - name: Validate data, statistics and build
        if: steps.generate.outputs.skip != 'true'
        run: npm test

      - name: Open Pull Request
        if: steps.generate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEST_ID: ${{ steps.generate.outputs.test_id }}
          SOURCE_ID: ${{ steps.generate.outputs.source_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: import community test report from Issue #${ISSUE_NUMBER}" -m "Generated by issue-to-pr.yml after maintainer approval (${TEST_ID}, ${SOURCE_ID}). Merging publishes to GitHub Pages."
          git push --force-with-lease origin "$BRANCH" || git push -f origin "$BRANCH"
          printf '%s\n' \
            "Automatically generated from Issue #${ISSUE_NUMBER} after maintainer approval." \
            "" \
            "- Report: ${TEST_ID}, provenance ${SOURCE_ID}" \
            "- Files: data/tests.json, data/games.json (when needed), data/updates.json, README.md, CHANGELOG.md" \
            "- npm test already passed in the generating workflow (validation + 33 README figures + build)" \
            "" \
            "Please verify the Issue content against the generated records, then merge. deploy.yml publishes to GitHub Pages automatically after the merge." \
            "If the PR check shows 'Approve workflows to run', click it once. Even without that, deploy.yml runs the full npm test again before publishing." \
            > /tmp/pr-body.md
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            echo "Existing PR for $BRANCH was updated."
            PR_URL="$(gh pr view "$BRANCH" --json url --jq .url)"
          else
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "data: import Issue #${ISSUE_NUMBER} (${TEST_ID})" --body-file /tmp/pr-body.md)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "已通过审核并自动生成数据变更，等待合并 PR 后发布：${PR_URL}（${TEST_ID} / ${SOURCE_ID}）"

      - name: Report failure to the Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "自动收录失败，未创建 PR。请查看工作流日志并修正 Issue 内容后重新审核：${RUN_URL}"
