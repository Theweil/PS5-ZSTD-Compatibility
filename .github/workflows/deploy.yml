name: Deploy to GitHub Pages

# Official GitHub Pages deployment flow (actions/configure-pages,
# upload-pages-artifact, deploy-pages). Only the trusted default branch deploys.
# Action majors verified against the official action repositories in Nov 2026.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Defence in depth: even a workflow_dispatch from another ref cannot publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test = validate + stats:check + build. A broken dataset can never
      # reach the published site.
      - name: Validate data and build dist/
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # No-op when Pages is already configured; enables it on a fresh fork.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
